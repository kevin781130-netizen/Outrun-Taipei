name: Verify game
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: V53.1 baseline — 15 routes, two moods
        run: node tools/performance.cjs
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-qa
          path: test-results/
